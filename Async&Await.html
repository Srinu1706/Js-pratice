      function OrderPizza(){
        return new Promise((reolve,reject)=>{
          let isavalible= true;
          setTimeout(() => {
            if(isavalible==true){
              resolve("Order Pizza");
            }
            else{
              reject("No pizzas avalible")
            }
          }, 2000);
        })
      }

       function makePayment() {
        return new Promise((resolve,reject)=>{
          let ispaymentDone=true;
            setTimeout(() => {
              if(ispaymentDone===true){
                resolve("Payment sucessfully done")
              }
              else{
                reject("Payment failed")
              }
            }, 3000);
        })
      }
